name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The escape-hatch check diffs against the base branch.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: scripts/verify check
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: scripts/verify check --base "origin/$BASE_REF"
      - name: scripts/verify conformance
        run: scripts/verify conformance
      - name: Keep the verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify
          path: target/verify/
