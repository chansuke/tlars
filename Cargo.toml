[workspace]
resolver = "3"
members = [
    "crates/tlars-java",
    "crates/tlars-msg",
    "crates/tlars-sany",
    "crates/tlars-tool",
    "crates/tlars-check",
    "crates/tlars",
    "crates/tlars-conformance",
    "crates/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

# No [workspace.dependencies] beyond path crates. The binary links mimalloc as its allocator.

# Release code with symbols, for samply/perf (`cargo build --profile profiling`).
[profile.profiling]
inherits = "release"
debug = true

# Each crate opts in with `[lints] workspace = true`. A lint that must stay quiet on one
# item takes `#[expect(<lint>, reason = "...")]` there, never a bare `#[allow]`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_macros = "deny"
undocumented_unsafe_blocks = "deny"
