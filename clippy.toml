# Determinism guard (DESIGN.md "Determinism", rule 2). Iterating std hash containers
# would leak a random order into TLC-visible output. CI runs clippy with -D warnings.
# The one sanctioned exception (the Interner lookup index, tlars-sany/src/intern.rs)
# carries a local #[allow(clippy::disallowed_types)] with a comment saying why order cannot leak.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order leaks into output; use BTreeMap or tlars_java::Hashtable" },
    { path = "std::collections::HashSet", reason = "iteration order leaks into output; use BTreeSet" },
]

# Output contract (DESIGN.md decision 9): only a `Report` writes what TLC would print.
disallowed-macros = [
    { path = "std::print", reason = "write TLC-visible output through tlars_msg::Report; remove debugging output" },
    { path = "std::println", reason = "write TLC-visible output through tlars_msg::Report; remove debugging output" },
    { path = "std::eprint", reason = "write TLC-visible output through tlars_msg::Report; remove debugging output" },
    { path = "std::eprintln", reason = "write TLC-visible output through tlars_msg::Report; remove debugging output" },
    { path = "std::dbg", reason = "remove debugging output before committing" },
]
